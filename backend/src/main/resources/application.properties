spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/band_website
spring.datasource.username=tatanakovalenko
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# The deployed application receives these values as environment variables.
# Do not put a real username or password hash in this file.
admin.username=${ADMIN_USERNAME}
admin.password-hash=${ADMIN_PASSWORD_HASH}

# Comma-separated browser origins that are allowed to call the API.
# Render will override this with the deployed Vercel URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
